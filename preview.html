<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>于辣辣工作台 · 预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e8eaf0 0%, #d8e0e8 50%, #e4e1f0 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #3a3d4d;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 36px 28px; max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(70,80,110,0.15); text-align: center;
  }
  .title { font-size: 22px; font-weight: 800; color: #5a7d87; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #9aa0b0; margin-bottom: 24px; }
  .qr-wrap {
    background: #fff; padding: 16px; border-radius: 16px; display: inline-block;
    margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .qr-wrap img { width: 220px; height: 220px; display: block; }
  .btn {
    display: inline-block; background: #7b9ea8; color: #fff; text-decoration: none;
    padding: 12px 28px; border-radius: 12px; font-size: 15px; font-weight: 700;
    margin-top: 8px; box-shadow: 0 6px 16px rgba(123,158,168,0.35);
  }
  .tips { margin-top: 20px; font-size: 12px; color: #9aa0b0; line-height: 1.7; text-align: left; background: #f6f7fa; padding: 14px; border-radius: 12px; }
  .tips strong { color: #5a7d87; }
  .url { font-size: 11px; color: #b5ad95; margin-top: 12px; word-break: break-all; }
  .dots { margin-top: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f4d06f; margin: 0 3px; }
</style>
</head>
<body>
<div class="card">
  <div class="title">于辣辣工作台</div>
  <div class="sub">自媒体 · 备课 · 考研 · 做饭 · 惊喜</div>
  <div class="qr-wrap"><img src="preview-qr.png" alt="二维码"></div>
  <br>
  <a class="btn" href="index.html">立即打开工作台</a>
  <div class="tips">
    <strong>📱 添加到主屏幕（vivo S50 Pro mini）：</strong><br>
    1. 点击上面的"立即打开"<br>
    2. 浏览器菜单（右下角⋮）→ 添加到主屏幕<br>
    3. 桌面出现"娜"字图标，点开即用，离线也能打开
  </div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="url">https://rich-apples-beam.loca.lt</div>
</div>
</body>
</html>
